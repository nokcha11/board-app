<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>AI 체커 게임</title>
<link rel="stylesheet" href="css/checker.css">
<script src="js/checker.js" defer></script>
</head>

<body>

<div class="game-wrap">
  <h1>AI 체커 게임</h1>
  <div class="info" id="turnInfo">흰색 말 차례 - 내가 움직입니다</div>
  <div class="level-info" id="levelInfo"></div>

  <div class="board" id="board"></div>

  <div class="status-box">
    <div class="status-title">게임 상태</div>
    <div id="killMessage">아직 잡힌 말이 없습니다.</div>
    <div id="whiteCount">현재 흰색말 12개 남았습니다.</div>
    <div id="purpleCount">현재 보라색말 12개 남았습니다.</div>
    <div id="scoreText">현재 0대0입니다.</div>
  </div>

  <button onclick="resetGame()">다시 시작</button>
  <button onclick="location.href='checker_main.html'">메인으로</button>
</div>

<div class="win-modal" id="winModal">
  <div class="win-card">
    <h2 id="winTitle">승리!</h2>
    <p id="winMsg">축하합니다!</p>
    <button onclick="resetGame()">다시 시작</button>
  </div>
</div>


</body>
</html>
